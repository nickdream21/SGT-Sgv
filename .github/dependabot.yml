version: 2
updates:
  # WebSGV/packages.config (modelo legado) y los PackageReference de WebSGV.Tests,
  # que Dependabot encuentra a partir de WebSGV.sln en la raiz.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
    open-pull-requests-limit: 2
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Subidas mayores a mano: cambian la API del PDF (QuestPDF) y del Excel (ClosedXML).
      - dependency-name: QuestPDF
        update-types: ['version-update:semver-major']
      - dependency-name: ClosedXML
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
