name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Corrida semanal: avisa de vulnerabilidades nuevas aunque nadie toque el repo.
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

# El token del workflow solo puede leer el repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Acciones fijadas por SHA completo (el tag va en el comentario; Dependabot las actualiza).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Configurar Node (para retire.js)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Crear archivos de configuracion locales (stubs para compilar)
        shell: pwsh
        run: |
          Set-Content WebSGV/connectionStrings.config '<connectionStrings><add name="ConexionSGV" connectionString="Data Source=stub;Initial Catalog=stub;" providerName="System.Data.SqlClient" /></connectionStrings>'
          Set-Content WebSGV/appSettings.Secrets.config '<appSettings></appSettings>'

      # Restaura packages.config (a packages/, incluido el .targets de QuestPDF) y los PackageReference
      # de las pruebas, y audita ambos: alta (NU1903) y critica (NU1904) fallan; moderada y baja avisan.
      - name: Restaurar y auditar paquetes NuGet
        run: msbuild WebSGV.sln /t:Restore /p:RestorePackagesConfig=true /p:NuGetAudit=true /p:NuGetAuditMode=all /p:NuGetAuditLevel=low /warnaserror:NU1903,NU1904 /nologo /verbosity:minimal

      # retire.js solo usa el ultimo --path, por eso una corrida por carpeta.
      # Excepciones justificadas en .retireignore.json.
      - name: Auditar JS de terceros (Scripts/lib)
        run: npx --yes retire@6.1.0 --path WebSGV/Scripts/lib --ignorefile .retireignore.json

      - name: Auditar JS de terceros (Content/lib)
        run: npx --yes retire@6.1.0 --path WebSGV/Content/lib --ignorefile .retireignore.json

      - name: Compilar
        run: msbuild WebSGV.sln /t:Build /p:Configuration=Release /nologo /verbosity:minimal

      # Trinquete de analizadores (E6-3): falla si sube la cuenta de CA1031, CA2000, CA3002, CA3003 o
      # CA1062 respecto de herramientas/calidad/avisos-base.json. Compila aparte (obj/contar-avisos),
      # sin tocar bin/. Las reglas en error (WebSGV/SGV.globalconfig) ya las frena el paso anterior.
      - name: Contar avisos del trinquete
        shell: pwsh
        run: ./herramientas/calidad/contar-avisos.ps1

      # Con cobertura de lineas de WebSGV.dll (E6-1). Sin BD: las [FactBD] se saltan.
      - name: Ejecutar tests
        run: dotnet test WebSGV.Tests/WebSGV.Tests.csproj -c Release --logger "console;verbosity=minimal" --settings WebSGV.Tests/cobertura.runsettings --collect "Code Coverage;Format=cobertura" --results-directory TestResults/cobertura

      # Falla si el total, Services o Helpers bajan de herramientas/calidad/cobertura-minima.json.
      - name: Comparar cobertura con el minimo
        shell: pwsh
        run: ./herramientas/calidad/medir-cobertura.ps1 -Directorio TestResults/cobertura -Comparar

      # Se sube aunque falle el tope, para ver que bajo.
      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura
          path: TestResults/cobertura/**/*.cobertura.xml
          if-no-files-found: warn
          retention-days: 30
